<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox Dodge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{--bg:#f3f6f7;--fg:#1f2430;--muted:#5b6474;--rule:#d5dde2;--accent:#1f7f92;--chip:#e3eef1}
@media (prefers-color-scheme:dark){:root{--bg:#14121c;--fg:#ece9f2;--muted:#a19cb0;--rule:#2f2b3d;--accent:#6cc9d6;--chip:#221f2e;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 "Source Serif 4",Georgia,serif;padding:0 20px}
main{max-width:40rem;margin:0 auto;padding-block:56px 72px;display:grid;gap:22px}
h1{font:400 clamp(32px,8vw,48px)/1.1 "Silkscreen","Courier New",monospace;margin:0}
p{margin:0}
.tag{color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--bg);padding:12px 18px;border-radius:8px;text-decoration:none;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--accent)}
footer{border-top:1px solid var(--rule);padding-top:18px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Inbox Dodge</h1>
  <p class="tag">A retro pixel-art arcade game for iPhone. Your inbox is falling from the sky: drag to dodge, squeeze past for bonus points, and grab coffee for a shield.</p>
  <p><a class="btn" href="https://apps.apple.com/app/id6819072318">Download on the App Store</a></p>
  <footer>
    <p>Support and questions: buffyandharold@gmail.com</p>
    <p><a href="/privacy.html">Privacy Policy</a> · © 2026 Buffy &amp; Harold</p>
  </footer>
</main>
</body>
</html>
